<!DOCTYPE html>
<html lang="en">

<head>

    <!-- 
    #1 
     something I was reminded of is to make sure that I am not starting with a capital letter for the word when calling/naming the my HTML, CSS, and JAVASCRIPT files as it is considered a better practice
    
    
    #2
    I think I got why we need to use defer now, so basically if we didn't use defer any changes we apply using JAVASCRIPT will theoretically have an effect on an empty file, because the JAVASCRIPT file has been read by the program, but the HTML file has not been read yet.
    
    And why the JAVASCRIPT file has been read first before the HTML file? that's because the JAVASCRIPT file is initialized in the head tag, and everything in the HTML file is written in the body tag, and the body tagcomes before the head tag.
     
    so why am I using JAVASCRIPT? I am using it apply changes that will have an effect on my website, or in this case my pacman game, and it will apply new interactions to my pacman game or to my website
    -->
    <script src="script.js" defer></script>
</head>

<body>

    <header>

    <!-- I have wondered alot about if I can use a class and an id for same tag like here it's div or it could be anything else, and I think I have my answer now -->

        <h1>LeaderBoard:</h1>
        <ol>
            <li>Chris........100</li>
            <li>Mark.........75</li>
            <li>Tom..........50</li>
            <li>John.........45</li>
            <li>John2........40</li>
            <li>John3........35</li>
        </ol>
    </div>

    <!-- if I understand correctly we are not typing anything in main here in the HTML file, because we are targetting main in the JAVASCRIPT file and adding content from there -->
    <main>
    </main>

    <div class="lives">
        <h1>Lives:</h1>
        <ul>
            <!-- removing the lives to create the lives soley from JavaScript -->
        </ul>
    </div>

    <div class="score">
        <h1>Score:</h1>
        <p id="Pscore">0</p>
    </div>

    <div class="controls">
        <button id="lbttn">&#9664;</button> <!-- LEFT -->
        <button id="ubttn">&#9650;</button> <!-- UP -->
        <button id="rbttn">&#9654;</button> <!-- RIGHT -->
        <button id="dbttn">&#9660;</button> <!-- DOWN -->
    </div>

</body>

</html>
